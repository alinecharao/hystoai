name: Story isolation and encryption database tests
on:
  pull_request:
    paths:
      - "supabase/migrations/20261029_story_isolation_*.sql"
      - "supabase/migrations/20261029_story_encryption_prepare.sql"
      - "supabase/migrations/20261031_visual_generation_quotas.sql"
      - "supabase/verification/**"
      - ".github/workflows/story-isolation-db.yml"
  push:
    branches: [testing, main]
    paths:
      - "supabase/migrations/20261029_story_isolation_*.sql"
      - "supabase/migrations/20261029_story_encryption_prepare.sql"
      - "supabase/migrations/20261031_visual_generation_quotas.sql"
      - "supabase/verification/**"
      - ".github/workflows/story-isolation-db.yml"
  workflow_dispatch:
jobs:
  isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_only
          POSTGRES_USER: postgres
          POSTGRES_DB: hysto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hysto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test_only
      PGDATABASE: hysto_test
    steps:
      - uses: actions/checkout@v4
      - name: Create synthetic legacy schema and records
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/verification/20261029_story_isolation_fixture.sql
      - name: Apply staged migrations to ephemeral database
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_story_isolation_stage1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_story_isolation_stage2_rpcs.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_story_isolation_stage3_cutover.sql
          # The Lovable clone lacks an optional legacy memory RPC. Repeat
          # the cutover without it to test idempotent, safe migration.
          psql -X -v ON_ERROR_STOP=1 -c "DROP FUNCTION IF EXISTS public.commit_chat_story_memory(uuid,uuid,text,text,text)"
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_story_isolation_stage3_cutover.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261029_story_encryption_prepare.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261031_visual_generation_quotas.sql
      - name: Verify owner isolation, regeneration, clearing and legacy preservation
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/verification/20261029_story_isolation_smoke.sql
      - name: Verify encrypted storage access, origin and deletion cleanup
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/verification/20261029_story_encryption_smoke.sql
      - name: Verify billable image budgets and replay prevention
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/verification/20261031_visual_generation_quotas_smoke.sql
