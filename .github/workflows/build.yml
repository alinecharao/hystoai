name: Hysto build validation

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # TanStack Router generates src/routeTree.gen.ts when Vite runs.
      - name: Production build and route generation
        run: bun run build
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Unit tests
        run: bunx vitest run
